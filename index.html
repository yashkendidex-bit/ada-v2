<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>A.D.A</title>
    <link rel="icon" href="data:," />
  </head>
  <body>
    <canvas id="orb-canvas" aria-hidden="true"></canvas>

    <div id="conn" title="Connection to A.D.A"></div>

    <div id="controls">
      <button id="btn-mute" type="button" title="Mute microphone (M)" aria-pressed="false">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
          <line x1="12" y1="19" x2="12" y2="23"/>
        </svg>
      </button>
      <button id="btn-stop" type="button" title="Stop speaking (Esc)" hidden>Stop</button>
    </div>

    <div id="status-text" role="status" aria-live="polite"></div>

    <div id="clarify" role="dialog" aria-live="assertive" hidden>
      <div id="clarify-q"></div>
      <div id="clarify-choices"></div>
    </div>

    <div id="auth-lock" role="alertdialog" aria-live="assertive" aria-labelledby="auth-title" hidden>
      <div class="auth-card">
        <div id="auth-title" class="auth-title">System locked</div>
        <div class="auth-frame"><img id="auth-frame" alt="Camera" /></div>
        <div id="auth-msg">Look at the camera to unlock</div>
      </div>
    </div>

    <div id="transcript" aria-live="polite"></div>

    <form id="composer" autocomplete="off">
      <input id="composer-input" type="text" placeholder="Type to A.D.A" aria-label="Message A.D.A" />
      <button id="composer-send" type="submit">Send</button>
    </form>

    <div id="ada-label">A.D.A</div>
    <div id="toast" role="alert" hidden></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
